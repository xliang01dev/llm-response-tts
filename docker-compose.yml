name: llm-response-tts

services:
  kokoros:
    # Pinned to the commit that was security-audited (see docs/security-resolution.md #1) -
    # an unpinned git build source means every --build could silently pull a different
    # upstream commit. Bump this deliberately (and re-audit) to pick up upstream changes.
    build: https://github.com/lucasjinreal/kokoros.git#b54354b860df94b064e254524777ce41d4d2c689
    container_name: llm-response-tts-kokoros
    restart: unless-stopped
    command: ["--instances", "3", "openai"]
    # Hardening (see docs/security-resolution.md #5b): kokoros' own dependency tree has
    # known RustSec advisories we can't patch directly (not our source) - this bounds what
    # code running inside that process could do if one were ever actually triggered.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    networks:
      - backend
    expose:
      - "3000"
    volumes:
      - ./docker/tmp:/app/tmp

  redis:
    image: redis:7-alpine
    container_name: llm-response-tts-redis
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "6379"

  ingress:
    build:
      context: ./services
      dockerfile: ingress/Dockerfile
    container_name: llm-response-tts-ingress
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - backend
    environment:
      REDIS_URL: redis://redis:6379
      # Must match worker's bind mount below and ingest/player's own default (see
      # host/tools/src/common.rs::sound_output_base()) - ingress derives each job's
      # output_dir from this rather than trusting a client-supplied path (see
      # docs/security-resolution.md #2).
      LLM_RESPONSE_TTS_SOUND_OUTPUT: /tmp/llm-response-tts/output
    expose:
      - "3001"

  worker:
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      - redis
      - kokoros
    networks:
      - backend
    environment:
      REDIS_URL: redis://redis:6379
      KOKOROS_URL: http://kokoros:3000
      KOKOROS_VOICE: af_heart
    volumes:
      - ./services/worker/word-references.json:/app/word-references.json:ro
      - ./services/worker/strip-characters.json:/app/strip-characters.json:ro
      - ./services/worker/measurement-units.json:/app/measurement-units.json:ro
      # Bind-mounted at the identical path inside the container (not the usual /app/...) so
      # any output_dir a job carries (always a subdirectory of this - built by ingest/player
      # from LLM_RESPONSE_TTS_SOUND_OUTPUT, default /tmp/llm-response-tts/output) resolves to
      # the same real files whether worker or player accesses it.
      - /tmp/llm-response-tts/output:/tmp/llm-response-tts/output

  nginx:
    # Pinned (see docs/security-resolution.md #3) rather than the floating `alpine` tag -
    # bump deliberately, same reasoning as kokoros' pinned build source above.
    image: nginx:1.31.3-alpine
    container_name: llm-response-tts-nginx
    restart: unless-stopped
    depends_on:
      - ingress
    # Multi-homed (see docs/security-resolution.md #5a): nginx is the only service on
    # `edge` (so it's the only one that can have a host-published port at all) and is also
    # on `backend` so it can reach ingress. Everything else - redis, ingress, worker,
    # kokoros - is backend-only, which is `internal: true` (no route to the internet). That
    # neutralizes kokoros' rustls-webpki advisories specifically: even in the narrow case
    # where its reqwest fallback fires (see docs/security-resolution.md informational
    # notes), it has nowhere to actually connect to.
    networks:
      - edge
      - backend
    env_file:
      - path: docker/.env
        required: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates
      - ./docker/nginx/entrypoint.d/25-check-bearer-token.sh:/docker-entrypoint.d/25-check-bearer-token.sh:ro

networks:
  edge:
    name: llm-response-tts-edge
  backend:
    name: llm-response-tts-backend
    internal: true
