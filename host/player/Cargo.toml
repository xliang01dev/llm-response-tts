[package]
name = "kokoros-player"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.189"
rodio = { version = "0.22.2", default-features = false, features = ["wav", "playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.3.0", features = ["json"] }
